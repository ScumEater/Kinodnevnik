name: Build Android APK

on:
  push:
    branches:
      - codex/android-nav-search
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag to attach the APK to"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Use Android SDK preinstalled on the runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -d /usr/local/lib/android/sdk/platforms/android-35
          test -d /usr/local/lib/android/sdk/build-tools/35.0.1

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          apk="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$apk" > /tmp/kinodnevnik-badging.txt
          grep -F "package: name='ru.nick.kinodnevnik' versionCode='13' versionName='1.12'" /tmp/kinodnevnik-badging.txt

      - name: Stage APK and project archive
        run: |
          mkdir -p release-files
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-files/Kinodnevnik-1.12.apk
          zip -qr release-files/Kinodnevnik-project-1.12.zip README.md movie_tracker.html movie-library.json android-app \
            -x 'android-app/.gradle/*' 'android-app/**/build/*' 'android-app/local.properties'

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinodnevnik-${{ github.run_number }}
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: Kinodnevnik-${{ github.run_number }}
          path: release-files

      - name: Publish APK and source archive
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --title "Kinodnevnik $release_tag" --generate-notes
          fi
          gh release upload "$release_tag" release-files/Kinodnevnik-1.12.apk release-files/Kinodnevnik-project-1.12.zip --clobber

