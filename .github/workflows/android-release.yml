name: Build Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new release tag to attach the APK to"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Use Android SDK preinstalled on the runner
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          test -d /usr/local/lib/android/sdk/platforms/android-35
          test -d /usr/local/lib/android/sdk/build-tools/35.0.1

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare release files
        id: release_files
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag="${REQUESTED_TAG:-${GITHUB_REF_NAME}}"
          version="${release_tag#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${release_tag}" >> "$GITHUB_OUTPUT"
          cp android-app/app/build/outputs/apk/debug/app-debug.apk "Kinodnevnik-${version}.apk"
          zip -qr "Kinodnevnik-project-${version}.zip" README.md movie_tracker.html movie-library.json android-app \
            -x 'android-app/.gradle/*' 'android-app/**/build/*' 'android-app/local.properties'

      - name: Publish APK and source archive
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_files.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_files.outputs.version }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Kinodnevnik $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            "Kinodnevnik-${RELEASE_VERSION}.apk" \
            "Kinodnevnik-project-${RELEASE_VERSION}.zip" \
            --clobber
